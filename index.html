          ? matrixSec(costing, idx[a2], idx[b2]) : null;
        if(v2 == null){ row.push(null); holes++; } else { row.push(v2); filled++; }
      }
      m2.push(row);
    }
    // worth using only if the matrix supplied the bulk of it
    if(filled > holes){ mat = m2; offline = true; }
  }
  if((!mat || !offline) && pts.length <= TOUR_MAX + 1){
    try{
      var r = await fetchT(VALHALLA, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          sources: pts.map(function(p){ return {lat:p.lat, lon:p.lon}; }),
          targets: pts.map(function(p){ return {lat:p.lat, lon:p.lon}; }),
          costing: costing
        })
      }, ROAD_TIMEOUT);
      if(r.ok) mat = (await r.json()).sources_to_targets.map(function(row){
        return row.map(function(x){ return x && typeof x.time === 'number' ? x.time : null; });
      });
    }catch(e){}
  }
  if(my !== token) return;
  // fill gaps (or the whole matrix) from beeline estimates, honestly labelled
  function est(a, b){
    return beelineSec(pts[a].lat, pts[a].lon, pts[b].lat, pts[b].lon, costing);
  }
  if(!mat){
    estimated = true;
    mat = pts.map(function(_, i){ return pts.map(function(_, j){ return est(i, j); }); });
  }else{
    for(var i = 0; i < mat.length; i++) for(var j = 0; j < mat.length; j++)
      if(mat[i][j] == null){ estimated = true; mat[i][j] = est(i, j); }
  }
  /* Opening hours turn this from "shortest ride" into "earliest finish that
     actually gets through the doors". Waiting for a door counts, and a stop
     whose last window shuts before she can reach it is reported, not hidden. */
  var baseMs = depBaseMs();
  var timed = hasHours(rem);
  var win = timed ? [null].concat(rem.map(function(l){ return windowsFor(l, baseMs); }))
                  : null;
  var res = timed ? FlotteEngine.tourOrderTW(mat, win)
                  : {order: FlotteEngine.tourOrder(mat), dropped: [], arrive: null};
  var perm = res.order;

  // price every possible first stop, so deviating is an informed choice
  var altTotals = {};
  for(var k = 1; k < mat.length; k++){
    var idxs = [k];
    for(var j3 = 1; j3 < mat.length; j3++) if(j3 !== k) idxs.push(j3);
    var sub = idxs.map(function(a){ return idxs.map(function(b){ return mat[a][b]; }); });
    if(timed){
      // forcing k first shifts everyone else's windows by the arrival there
      var atK = FlotteEngine.feasibleAt(mat[0][k], win[k]);
      if(atK == null){ altTotals[rem[k-1]._i] = null; continue; }
      var subWin = idxs.map(function(a, n2){
        if(n2 === 0) return null;
        var w = win[a];
        if(!w) return null;
        return w.map(function(sp){ return [sp[0] - atK, sp[1] - atK]; })
                .filter(function(sp){ return sp[1] > 0; });
      });
      var r2 = FlotteEngine.tourOrderTW(sub, subWin);
      altTotals[rem[k-1]._i] = atK + r2.finish;
    }else{
      altTotals[rem[k-1]._i] = mat[0][k] + FlotteEngine.tourCost(sub, FlotteEngine.tourOrder(sub));
    }
  }
  tour = {
    order: perm.map(function(k){ return rem[k-1]._i; }),
    dropped: (res.dropped || []).map(function(k){ return rem[k-1]._i; }),
    totalSec: timed ? res.finish : FlotteEngine.tourCost(mat, perm),
    arriveAt: timed ? (function(){
      var out = {};
      Object.keys(res.arrive || {}).forEach(function(k){
        out[rem[k-1]._i] = baseMs + res.arrive[k] * 1000;
      });
      return out;
    })() : null,
    timed: timed, baseMs: baseMs, offline: offline,
    altTotals: altTotals,
    estimated: estimated, costing: costing, legShapes: prevShapes
  };
  drawTour();
}

/* One reachable-from call per hop surfaces stations that only transit serves
   well — otherwise the road-nearest five hide them and transit can never win. */
async function transitScan(my, all){
  scanInfo = null;
  if(!options.length || !all.length) return;
  var worst = 0;
  options.forEach(function(o){
    var t = Math.min(o.walk ? o.walk.sec : 1e9, o.bike ? o.bike.sec : 1e9);
    if(t < 1e9 && t > worst) worst = t;
  });
  var cutoff = Math.max(600, worst);
  var from = here();
  var rows = null;
  try{
    var r = await vbbGet('/stops/reachable-from?latitude=' + from.lat +
      '&longitude=' + from.lon + '&address=' + encodeURIComponent(from.label || 'Start') +
      '&maxDuration=' + Math.min(60, Math.ceil(cutoff / 60)) + '&maxTransfers=2',
      VBB_TIMEOUT);
    if(r.ok) rows = (await r.json()).reachable;
  }catch(e){}
  if(my !== token) return;
  scanInfo = {ok: !!rows, added: 0};
  if(!rows) return;
  var have = options.map(function(o){ return o.i; });
  var cands = FlotteEngine.transitCandidates(rows,
    all.map(function(o){ var l = LOCATIONS[o.i]; return {i: o.i, lat: l.lat, lon: l.lon}; }),
    {cutoffSec: cutoff, maxKm: 0.5, k: 3, exclude: have});
  cands.forEach(function(c){
    var o = all.filter(function(x){ return x.i === c.i; })[0];
    if(o){ o.viaScan = true; options.push(o); }
  });
  scanInfo.added = cands.length;
  await sleep(GAP);   // reachable-from is a VBB call too — keep the rate gap
}

async function nextHop(){
  var my = ++token;
  busy = true; options = []; expanded = null; scanInfo = null;
  lines.clearLayers();
  paint();

  var pool = eligible().filter(function(loc){ return visitedIdx().indexOf(loc._i) === -1; });
  if(mission) pool = pool.filter(function(loc){ return defectiveAt(loc).length; });
  if(!pool.length){
    busy = false;
    if(mission){ tour = null; tourLines.clearLayers(); }
    paint(); return;
  }

  if(mission){ await ensureTour(my); if(my !== token) return; }

  var walk, bike;
  roadEstimated = false;
  try{
    var pair = await Promise.all([matrix('pedestrian', pool), matrix('bicycle', pool)]);
    walk = pair[0]; bike = pair[1];
  }catch(e){
    if(my !== token) return;
    /* The road router being down must not empty the screen. Everything else
       still works — which bikes are flagged, where they are, the visiting
       order, opening hours — so fall back to straight-line estimates and say
       so, rather than showing her an error and nothing to act on. */
    roadEstimated = true;
    var f = here();
    walk = pool.map(function(l){
      return {sec: beelineSec(f.lat, f.lon, l.lat, l.lon, 'pedestrian'),
              km: beelineKm(f.lat, f.lon, l.lat, l.lon)};
    });
    bike = pool.map(function(l){
      return {sec: beelineSec(f.lat, f.lon, l.lat, l.lon, 'bicycle'),
              km: beelineKm(f.lat, f.lon, l.lat, l.lon)};
    });
  }
  if(my !== token) return;

  var all = pool.map(function(loc, k){
      return {i: loc._i, walk: walk[k], bike: bike[k], transit: null, selJ: 0};
    })
    .filter(function(o){ return o.walk || o.bike; });

  if(mission && tour && tour.order.length){
    // the round IS the list: the optimal order's next stops, in that order
    var rank = {};
    tour.order.forEach(function(idx, p){ rank[idx] = p; });
    options = all.filter(function(o){ return rank[o.i] !== undefined; })
      .sort(function(a, b){ return rank[a.i] - rank[b.i]; })
      .slice(0, SHOW);
  }else{
    options = all.slice()
      .sort(function(a, b){
        var A = Math.min(a.walk ? a.walk.sec : 1e9, a.bike ? a.bike.sec : 1e9);
        var B = Math.min(b.walk ? b.walk.sec : 1e9, b.bike ? b.bike.sec : 1e9);
        return A - B;
      })
      .slice(0, SHOW);
  }

  // sanity check: geolocation can miss by tens of km (IP-based fallback).
  farKm = null;
  if(options.length){
    var o0 = options[0];
    var nearSec = Math.min(o0.walk ? o0.walk.sec : 1e9, o0.bike ? o0.bike.sec : 1e9);
    if(nearSec > 3600){
      var kk = o0.bike && o0.bike.km != null ? o0.bike.km : (o0.walk ? o0.walk.km : null);
      farKm = kk != null ? Math.round(kk) : -1;
    }
  }
  paint(); drawTrip(); frame();

  /* Walk and Bike never render a transit row, so asking VBB for one is pure
     waste: five stations x three retries of a service she cannot see the answer
     from. It is also where every console error in a bike round comes from.
     Switching to Best or Transit re-runs this hop and fetches then. */
  var wantsTransit = modePref === 'best' || modePref === 'transit';
  // in a round the candidate set is the plan itself — no scan needed
  if(wantsTransit && !(mission && tour)){
    await transitScan(my, all);
    if(my !== token) return;
    paint(); drawTrip();
  }

  /* VBB down for two stations running is VBB down for all five. Each failure
     costs 3 timeouts plus backoff, so proving it station by station is minutes
     of spinner for a user standing at a junction — stop and let them retry. */
  var downStreak = 0;
  for(var k = 0; wantsTransit && k < options.length; k++){
    if(my !== token) return;
    if(options[k].transit) continue;
    if(downStreak >= 2){
      options[k].transit = {err:'service unavailable', kind:'down'};
      continue;
    }
    var res = await transitFor(LOCATIONS[options[k].i]);
    if(my !== token) return;
    options[k].transit = res;
    downStreak = (res && res.kind === 'down') ? downStreak + 1 : 0;
    paint();
    if(k < options.length - 1 && downStreak < 2) await sleep(GAP);
  }
  if(my !== token) return;
  busy = false;
  paint(); drawTrip();
  // phones have no hover: the best option's route shows itself
  if(expanded == null && options.length) previewOf(sorted()[0].i);
}

/* ---------- actions ---------- */
function start(lat, lon, label){
  trip = [{lat:lat, lon:lon, label:label, i:null, sec:0}];
  picking = false;
  sheetTo('half');
  map.getContainer().style.cursor = '';
  try{
    localStorage.setItem('flotte-last-start',
      JSON.stringify({lat:lat, lon:lon, label:label, t:Date.now()}));
  }catch(e){}
  drawBase();
  nextHop();
}
function choose(i){
  var o = optOf(i);
  if(!o || busy) return;
  var loc = LOCATIONS[i];
  var mode = modePref === 'best' ? (bestMode(o) || 'walk') : modePref;
  var from = {lat: here().lat, lon: here().lon};
  // goMs anchors the chain in real time: this is when she actually set off
  var hop = {lat:loc.lat, lon:loc.lon, label:loc.location_name, i:i, mode:mode,
             goMs: Date.now()};
  if(mode === 'transit' && o.transit && o.transit.journeys){
    var j = o.transit.journeys[o.selJ || 0];
    hop.sec = Math.max(0, (new Date(j.arr) - depBaseMs()) / 1000);
    hop.rideSec = Math.max(0, (new Date(j.arr) - new Date(j.dep)) / 1000);
    hop.dep = j.dep; hop.arr = j.arr; hop.legs = j.legs;
  }else{
    var rec = mode === 'bike' ? o.bike : o.walk;
    hop.sec = rec ? rec.sec : timeFor(o, 'best');
    hop.km = rec ? rec.km : null;
    var cached = o[mode === 'walk' ? '_walkShape' : '_bikeShape'];
    if(cached) hop.shape = cached;
    else fetchShape(from, {lat:loc.lat, lon:loc.lon},
        mode === 'walk' ? 'pedestrian' : 'bicycle')
      .then(function(pts){
        if(pts && trip.indexOf(hop) !== -1){ hop.shape = pts; drawTripLines(); }
      });
  }
  trip.push(hop);
  drawTripLines();
  drawBase();
  sheetTo('peek');          // you're moving now — the map is what matters
  nextHop();
}
function back(){
  if(trip.length < 2) return;
  trip.pop();
  lines.clearLayers();
  drawTripLines();
  drawBase();
  nextHop();
}
function reset(){
  token++;
  trip = []; options = []; busy = false; expanded = null;
  tour = null; scanInfo = null;
  lines.clearLayers(); pins.clearLayers();
  tripLines.clearLayers(); tourLines.clearLayers();
  drawBase(); paint();
  map.flyTo([52.5075, 13.404], 11, {animate:!reduce});
}
function enterMission(){
  mission = true; view = 'plan';
  drawBase();
  if(trip.length) nextHop(); else paint();
}
function exitMission(){
  mission = false;
  tour = null; tourLines.clearLayers();
  drawBase();
  if(trip.length) nextHop(); else paint();
}
function markRepaired(id){
  defects.delete(id);
  repaired.add(id);
  saveDefects(); saveAdhoc();
  var loc = LOCATIONS.filter(function(l){
    return l.items.some(function(it){ return it.id === id; });
  })[0];
  drawBase();
  // station fully handled → it leaves the round and the plan re-solves
  if(mission && loc && !defectiveAt(loc).length && trip.length) nextHop();
  else paint();
}
/* hand the whole trip to Google Maps: origin, every stop as a waypoint.
   Transit mode there only works point-to-point, so multi-stop trips open in
   the dominant road mode and the user can flip modes inside Google. */
function gmapsUrl(){
  if(trip.length < 2) return null;
  var o = trip[0], d = trip[trip.length - 1];
  var wp = trip.slice(1, -1).map(function(s){ return s.lat + ',' + s.lon; }).join('|');
  var mode;
  if(trip.length === 2 && trip[1].mode === 'transit') mode = 'transit';
  else if(trip.some(function(s){ return s.mode === 'bike'; })) mode = 'bicycling';
  else mode = 'walking';
  return 'https://www.google.com/maps/dir/?api=1' +
    '&origin=' + o.lat + ',' + o.lon +
    '&destination=' + d.lat + ',' + d.lon +
    (wp ? '&waypoints=' + encodeURIComponent(wp) : '') +
    '&travelmode=' + mode;
}
function openGmaps(){
  var u = gmapsUrl();
  if(u) window.open(u, '_blank', 'noopener');
}
/* Google transit is strictly A-to-B (no waypoints even in their own UI),
   so transit legs hand off one at a time. */
function gmapsLegUrl(fLat, fLon, tLat, tLon, mode){
  return 'https://www.google.com/maps/dir/?api=1' +
    '&origin=' + fLat + ',' + fLon + '&destination=' + tLat + ',' + tLon +
    '&travelmode=' + (mode || 'transit');
}
function copyPlan(){
  var out = ['fLotte Berlin trip — ' + new Date().toISOString().slice(0,10)];
  trip.forEach(function(s, n){
    if(n === 0){ out.push('Start: ' + s.label); return; }
    var line = n + '. ' + s.label + ' — ' + (s.mode || 'travel') + ' ' + mins(s.sec);
    if(s.mode === 'transit' && s.legs){
      var parts = s.legs.filter(function(L){ return !L.walking; })
        .map(function(L){ return L.line + ' (' + clock(L.dep) + '→' + clock(L.arr) + ')'; });
      if(parts.length) line += ' via ' + parts.join(', ');
    }else if(s.km != null){
      line += ' · ' + km(s.km);
    }
    out.push(line);
    if(s.mode === 'transit'){
      var prev = trip[n - 1];
      out.push('   leg in Google: ' + gmapsLegUrl(prev.lat, prev.lon, s.lat, s.lon));
    }
  });
  out.push('Total travel ~' + mins((depBaseMs() - Date.now()) / 1000) +
    ' · arrive ~' + hhmm(depBaseMs()));
  var gm = gmapsUrl();
  if(gm) out.push('Map: ' + gm);
  var text = out.join('\n');
  function flash(ok){
    var b = document.getElementById('copy');
    if(b){ b.textContent = ok ? T('copied') : T('copyFail'); setTimeout(paint, 1400); }
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ flash(true); },
      function(){ legacyCopy(text, flash); });
  }else legacyCopy(text, flash);
}
function legacyCopy(text, flash){
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  var ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  flash(ok);
}

/* ---------- rendering ---------- */
function stripHTML(legs, depIso){
  var bits = [];
  legs.forEach(function(L, n){
    if(n) bits.push('<span class="sep">›</span>');
    if(L.walking){
      if(L.sec > 60) bits.push('<span>' + IC.walk + Math.round(L.sec/60) + '</span>');
      else if(!n || n === legs.length-1) bits.push('<span>' + IC.walk + '</span>');
      else bits.pop();
    }else{
      bits.push('<span class="lb" style="background:' + lineColor(L.line, L.bg) +
        ';color:' + safeColor(L.fg, '#fff') + '">' + esc(L.line || '?') + '</span>');
    }
  });
  if(depIso) bits.push('<span class="sep">·</span>',
    '<span class="num">dep ' + clock(depIso) + '</span>');
  return '<span class="strip">' + bits.join('') + '</span>';
}
function hintHTML(j){
  var first = null;
  for(var n = 0; n < j.legs.length; n++){ if(!j.legs[n].walking){ first = j.legs[n]; break; } }
  if(!first) return '';
  var bits = [];
  if(first.direction) bits.push(T('towards', {dir: esc(first.direction)}));
  if(first.platform) bits.push(T('platform', {p: esc(first.platform)}));
  if(first.delay != null && Math.abs(first.delay) >= 60)
    bits.push(T('delay', {sign: first.delay > 0 ? '+' : '−',
                          n: Math.round(Math.abs(first.delay)/60)}));
  return bits.length ? '<div class="hintline">' + bits.join(' · ') + '</div>' : '';
}
function depHTML(o, j, n){
  var lead = inMin(j.dep);
  var when = baseFuture()
    ? T('departsAt', {t: clock(j.dep)})
    : (lead != null && lead >= 0
        ? T('leavesIn', {n: lead < 1 ? 1 : lead}) : T('departed'));
  return '<button class="dep" type="button" data-i="' + o.i + '" data-j="' + n + '"' +
    ' aria-selected="' + ((o.selJ || 0) === n ? 'true' : 'false') + '">' +
    '<div class="dep-when num">' +
      '<span class="dep-clock">' + clock(j.dep) + ' — ' + clock(j.arr) + '</span>' +
      '<span class="dep-dur">' + mins((new Date(j.arr) - new Date(j.dep))/1000) + '</span>' +
      '<span class="dep-in">' + when + '</span>' +
    '</div>' +
    stripHTML(j.legs) + hintHTML(j) +
  '</button>';
}
/* Solo names the mode: with only one row left the icon alone is too quiet. */
function mv(icon, label, v, sel, extra, solo){
  return '<span class="mv' + (sel ? ' sel' : '') + '">' + icon +
    (solo ? '<span class="mv-l">' + label + '</span>' : '') +
    '<b>' + mins(v) + '</b>' + (extra ? '<span>· ' + extra + '</span>' : '') + '</span>';
}
function optHTML(o, n){
  var loc = LOCATIONS[o.i];
  var open = expanded === o.i;
  var shown = timeFor(o, modePref);
  // Best is the only comparing view; a picked mode shows that mode and nothing
  // else, so a card can never read as three routes at once
  var compare = modePref === 'best';
  var mode = compare ? bestMode(o) : modePref;
  var js = o.transit && o.transit.journeys;
  var tsec = transitSec(o);

  // line badges only when transit is the mode you would actually take
  var stripBit = mode === 'transit' && js && js.length
    ? stripHTML(js[o.selJ || 0].legs, js[o.selJ || 0].dep)
        .replace('class="strip"','class="strip" style="margin:9px 0 0 34px"')
    : '';

  var transitBit, tLab = compare ? '' : '<span class="mv-l">' + T('mTransit') + '</span>';
  if(o.transit && o.transit.err)
    transitBit = '<span class="mv">' + IC.tram + tLab +
      (o.transit.kind === 'down' ? T('unavailable') : T('noRoute')) + '</span>';
  else if(js) transitBit = mv(IC.tram, T('mTransit'), tsec, mode === 'transit',
    // the strip above already carries the departure — don't say it twice
    js.length && !stripBit ? 'dep ' + clock(js[o.selJ || 0].dep) : null, !compare);
  else transitBit = '<span class="mv">' + IC.tram + tLab + '…</span>';

  var html = '<div class="opt" id="opt-' + o.i + '" style="' +
    (ANIM ? 'animation-delay:' + (n*45) + 'ms' : 'animation:none') + '">' +
    '<button class="opt-main" type="button" data-i="' + o.i + '" aria-expanded="' + open + '">' +
      '<div class="opt-top">' +
        '<span class="opt-rank" style="background:' +
          (mission ? '#C75300' : colorOf(loc.district[0])) + '">' + (n+1) + '</span>' +
        '<span class="opt-name">' + esc(loc.location_name) +
          (mission && o.i === tourNext() ? ' <span class="ordertag">' + T('orderTag') + '</span>' : '') +
          (o.viaScan ? ' <span class="ordertag scan">' + T('scanTag') + '</span>' : '') + '</span>' +
        '<span class="opt-time num">' + mins(shown) + '</span>' +
      '</div>' +
      '<div class="opt-sub">' + esc([loc.street, loc.district[0]].filter(Boolean).join(' · ')) + '</div>' +
      (function(){
        /* Hours are the reason a nearer station can be the wrong next stop, so
           they belong on the card — and "not published" is said out loud
           rather than left blank, which would read as "open". */
        if(isAdhoc(loc)) return '<div class="hoursline none">' + T('adhocNoHours') + '</div>';
        /* When the German did not parse cleanly — alternating shifts, "see the
           notice on site", a day that is only by arrangement — show her the
           original words instead of a tidy summary that would hide the caveat. */
        if(loc.hours && loc.hours_exact === false && loc.hours_text)
          return '<div class="hoursline raw">' + IC.clock +
            T('hoursRaw', {text: esc(loc.hours_text.slice(0, 120))}) + '</div>';
        var lbl = hoursLabel(loc, depBaseMs());
        if(lbl === null) return '<div class="hoursline none">' + T('hoursNone') + '</div>';
        var shut = lbl === T('hoursClosed');
        var eta = shown != null ? depBaseMs() + shown * 1000 : null;
        var late = !shut && eta != null && !windowsCover(loc, depBaseMs(), shown);
        return '<div class="hoursline' + (shut || late ? ' shut' : '') + '">' +
          IC.clock + (shut ? T('hoursClosed')
            : T('hoursOpen', {range: esc(lbl)}) + (late ? T('hoursTooLate') : '')) +
          '</div>';
      })() +
      stripBit +
      '<div class="modeline num">' +
        (compare || modePref === 'walk'
          ? mv(IC.walk, T('mWalk'), o.walk && o.walk.sec, mode === 'walk',
              o.walk && km(o.walk.km), !compare) : '') +
        (compare || modePref === 'bike'
          ? mv(IC.bike, T('mBike'), o.bike && o.bike.sec, mode === 'bike',
              o.bike && km(o.bike.km), !compare) : '') +
        (compare || modePref === 'transit' ? transitBit : '') + '</div>' +
      (function(){
        // price the deviation: what the whole round costs if you start here
        if(!(mission && tour && tour.totalSec != null && tour.altTotals) || n === 0) return '';
        var alt = tour.altTotals[o.i];
        if(alt == null) return '';
        var diff = alt - tour.totalSec;
        return '<div class="hintline">' + T('wholeRound', {t: mins(alt)}) +
          (diff > 60 ? T('vsPlan', {d: mins(diff)}) : T('tiesPlan')) + '</div>';
      })() +
      '<div class="bikes">' + (mission
        ? loc.items.filter(function(it){ return defects.has(it.id) || repaired.has(it.id); })
        : loc.items.slice(0,3)).map(function(it){
        var bad = defects.has(it.id), done = repaired.has(it.id);
        return '<span class="bike' + (done ? ' ok' : '') + '">' +
          (thumbOK(it.thumbnail) ? '<img src="' + esc(it.thumbnail) + '" alt="" loading="lazy"' +
            ' width="26" height="26" data-thumb="' + esc(it.thumbnail) + '">' : '') +
          '<b>' + esc(it.name) + '</b><span class="' + (bad ? 'fix' : '') + '">' +
          (done ? T('repairedTag') : bad ? T('needsRepair') : esc(it.type[0] || '')) + '</span>' +
          (bad && mission ? '<span class="donebtn" data-done="' + it.id + '">' + T('done') + '</span>' : '') +
          '</span>';
      }).join('') + '</div>' +
    '</button>';

  if(open){
    html += '<div class="board"' + (BOARD_ANIM ? '' : ' style="animation:none"') + '>';
    // a road mode drills down into that road leg — departures belong to transit
    if(modePref === 'walk' || modePref === 'bike'){
      var rec = modePref === 'bike' ? o.bike : o.walk;
      html += '<div class="board-head"><span>' +
          (modePref === 'bike' ? T('boardBike') : T('boardWalk')) + '</span><span class="trip-links">' +
          '<button class="link" type="button" data-gleg="' + o.i + '" data-gmode="' +
          (modePref === 'bike' ? 'bicycling' : 'walking') +
          '">' + T('legInGoogle') + '</button></span></div>' +
        '<div class="note">' + (rec
          ? T(rec.km != null ? 'legAbout' : 'legAboutNoKm',
              {t: mins(rec.sec), km: km(rec.km), label: esc(here().label)})
          : T('noRoadRoute', {mode: modePref === 'bike' ? T('cycling') : T('walking')})) +
        '</div>';
    }else if(js && js.length){
      html += '<div class="board-head"><span>' + T('departures') + '</span><span class="trip-links">' +
        '<button class="link" type="button" data-gleg="' + o.i + '">' + T('legInGoogle') + '</button>' +
        '<button class="link" type="button" data-refresh="' + o.i + '">' + T('refresh') + '</button></span></div>' +
        js.map(function(j, k){ return depHTML(o, j, k); }).join('');
    }else if(o.transit && o.transit.err){
      html += o.transit.kind === 'down'
        ? '<div class="note">' + T('transitDown') +
          '<br><button class="retry" type="button" data-refresh="' + o.i + '">' +
          T('tryAgain') + '</button></div>'
        : '<div class="note">' + T('noTransit') + '</div>';
    }else{
      html += '<div class="note">' + T('checkingDep') + '</div>';
    }
    html += '<button class="go" type="button" data-go="' + o.i + '">' + T('goOn') +
      IC.right + '</button></div>';
  }
  return html + '</div>';
}
function mtab(id, icon, label){
  return '<button class="mtab" type="button" role="tab" data-mode="' + id + '"' +
    ' aria-selected="' + (modePref === id) + '">' + icon + label + '</button>';
}
function missionHTML(){
  if(!mission) return '';
  var left = defectStations().filter(function(l){ return visitedIdx().indexOf(l._i) === -1; });
  var bikes = left.reduce(function(a, l){ return a + defectiveAt(l).length; }, 0);
  // travel only — repair time is never estimated, see projectedArrivalMs
  var plan = '';
  if(tour && tour.totalSec != null){
    plan = T('bestOrder', {mode: costingLabel(tour.costing), t: mins(tour.totalSec)}) +
      // with hours in play the number is a finish time, not a ride length:
      // waiting for a door to open is part of it
      (tour.timed ? T('toLastStop', {at: hhmm(tour.baseMs + tour.totalSec * 1000)})
                  : T('travelWord')) +
      (tour.estimated ? T('estSuffix') : '');
  }
  return '<div class="mission">' + IC.wrench +
    '<span><b>' + T('round') + '</b> — ' +
    T('roundLeft', {bikes: T('nBikes', {n: bikes}),
                    stations: T('nStations', {n: left.length})}) + plan +
    (repaired.size ? T('nRepaired', {n: repaired.size}) : '') + '</span>' +
    '<button class="link addstop' + (addingStop ? ' on' : '') + '" type="button" ' +
      'id="addstop">' + IC.pin + (addingStop ? T('addStopArmed') : T('addStop')) + '</button>' +
    '<button class="link" type="button" id="exitm">' + T('exit') + '</button>' +
    (function(){
      var out = tour && tour.dropped && tour.dropped.length ? tour.dropped : null;
      if(!out) return '';
      var names = out.slice(0, 3).map(function(i){
        return '<b>' + esc(LOCATIONS[i].location_name) + '</b>';
      }).join(', ');
      return '<span class="ordernote">' + T('shutOut', {names: names,
        more: out.length > 3 ? T('andMore', {n: out.length - 3}) : ''}) + '</span>';
    })() +
    (function(){
      var mm = orderModeMismatch();
      if(!mm) return '';
      return '<span class="ordernote">' + T('mismatch',
        {n: mm.n, of: mm.of, mode: costingLabel(tour.costing)}) + '</span>';
    })() + '</div>';
}

function renderNav(){
  var nav = document.getElementById('nav');
  nav.innerHTML =
    // pick the bikes, then get the route — so Bikes comes first
    '<button type="button" data-view="catalogue" aria-selected="' + (view === 'catalogue') + '">' +
      IC.bike + T('navBikes') +
      (defects.size ? ' <span class="count">' + defects.size + '</span>' : '') + '</button>' +
    '<button type="button" data-view="plan" aria-selected="' + (view === 'plan') + '">' +
      IC.route + T('navPlan') + '</button>';
  Array.prototype.forEach.call(nav.querySelectorAll('button'), function(b){
    b.addEventListener('click', function(){
      view = b.getAttribute('data-view');
      if(view === 'catalogue') sheetTo('full');   // list work needs room
      drawBase(); paint();
    });
  });
}

function paintCatalogue(flow){
  var q = catQ.toLowerCase();
  // the filter drawer narrows the whole dataset, this list included; catQ then
  // searches within what the filters already allow
  var allowed = eligibleItems(), shown = {}, rows = [];
  /* Airbnb-style: pan or zoom the map and the list narrows to what is on screen.
     Bounds never touch the round — only what she is browsing. */
  var bounded = allowed;
  if(viewFilter && inView){
    bounded = allowed.filter(function(r){
      return isAdhoc(r.loc) || inView.contains([r.loc.lat, r.loc.lon]);
    });
  }
  var hiddenByMap = allowed.length - bounded.length;
  bounded.forEach(function(r){
    shown[r.it.id] = true;
    if(!q || (r.it.name + ' ' + r.it.short_desc + ' ' + r.loc.location_name + ' ' +
        r.loc.district[0]).toLowerCase().indexOf(q) !== -1) rows.push(r);
  });
  rows.sort(function(a, b){ return a.it.name.localeCompare(b.it.name); });
  // a bike you flagged can now be filtered out of sight — say so, because the
  // round button still counts it and a silent mismatch reads as a lost flag
  var buried = 0;
  defects.forEach(function(id){ if(!shown[id]) buried++; });

  flow.innerHTML =
    '<div class="cat-bar">' +
      '<div class="cat-search">' + IC.search +
        '<input id="catq" type="search" placeholder="' + esc(T('searchBikes',{n:rows.length})) + '" ' +
          'value="' + esc(catQ) + '" aria-label="' + esc(T('searchBikesLabel')) + '"></div>' +
      '<button class="run" id="run" type="button"' + (defects.size ? '' : ' disabled') + '>' +
        IC.route + T('optimalPath') + (defects.size ? ' (' + defects.size + ')' : '') + '</button>' +
    '</div>' +
    '<div class="cat-tools"><span>' + T('tapToFlag') +
      (filtersActive() ? T('filteredTo', {n: rows.length, m: TOTAL_ITEMS}) : '') + '</span>' +
      '<button class="link" id="rand5" type="button">' + T('flagRandom') + '</button>' +
      (defects.size ? '<button class="link" id="clearall" type="button">' + T('clearAll') + '</button>' : '') +
      (filtersActive() ? '<button class="link" id="clearf" type="button">' + T('clearFilters') + '</button>' : '') +
      (hiddenByMap > 0
        ? '<button class="link mapchip" id="mapall" type="button">' +
          T('hiddenByMap', {n: hiddenByMap}) + '</button>'
        : '') +
    '</div>' +
    (buried ? '<div class="buried">' + T('buried', {n: buried}) + '</div>' : '') +
    rows.map(function(r){
      var bad = defects.has(r.it.id), done = repaired.has(r.it.id);
      return '<button class="bikerow" type="button" data-id="' + r.it.id + '"' +
        ' data-loc="' + r.loc._i + '" aria-pressed="' + bad + '">' +
        (thumbOK(r.it.thumbnail)
          ? '<img src="' + esc(r.it.thumbnail) + '" alt="" loading="lazy" width="40" height="40"' +
            (done ? ' style="filter:grayscale(1);opacity:.55"' : '') +
            ' data-thumb="' + esc(r.it.thumbnail) + '" data-fail="ph">'
          : '<span class="ph">' + IC.bike + '</span>') +
        '<span class="bk-body"><span class="bk-name">' + esc(r.it.name) +
          (bad ? '<span class="fixtag">' + T('needsRepair') + '</span>'
               : done ? '<span class="fixtag ok">' + T('repairedTag') + '</span>' : '') + '</span>' +
        '<span class="bk-sub"><span class="bk-dot" style="background:' +
          colorOf(r.loc.district[0]) + '"></span>' +
          esc([r.loc.location_name, r.it.type[0]].filter(Boolean).join(' · ')) + '</span></span>' +
        '<span class="tick">' + IC.check + '</span>' +
      '</button>';
    }).join('');

  wireThumbs(flow);
  var catq = document.getElementById('catq');
  var catT = null;
  catq.addEventListener('input', function(){
    clearTimeout(catT);
    catT = setTimeout(function(){
      catQ = catq.value;
      var pos = catq.selectionStart;
      paint();
      var el = document.getElementById('catq');
      el.focus(); el.setSelectionRange(pos, pos);
    }, 200);
  });
  Array.prototype.forEach.call(flow.querySelectorAll('.bikerow'), function(b){
    b.addEventListener('click', function(){
      var id = +b.getAttribute('data-id');
      if(repaired.has(id)) repaired.delete(id);           // grey → back to normal
      else if(defects.has(id)) defects.delete(id);
      else defects.add(id);
      saveDefects(); drawBase(); paint();
    });
  });
  document.getElementById('rand5').addEventListener('click', function(){
    defects.clear();
    // draw from what the filters allow, or the demo flags bikes you cannot see
    var all = allowed.map(function(r){ return r.it.id; });
    while(defects.size < 5 && all.length){
      defects.add(all.splice(Math.floor(Math.random()*all.length), 1)[0]);
    }
    saveDefects(); drawBase(); paint();
  });
  var cf = document.getElementById('clearf');
  if(cf) cf.addEventListener('click', clearFilters);
  var ma = document.getElementById('mapall');
  if(ma) ma.addEventListener('click', function(){
    // show everything again by fitting the map around it, so the two stay honest
    inView = null; paint();
  });
  Array.prototype.forEach.call(flow.querySelectorAll('.bikerow'), function(b){
    var li = +b.getAttribute('data-loc');
    b.addEventListener('mouseenter', function(){ linkTo(li, 'list'); });
    b.addEventListener('focus', function(){ linkTo(li, 'list'); });
  });
  var ca = document.getElementById('clearall');
  if(ca) ca.addEventListener('click', function(){
    defects.clear(); repaired.clear(); saveDefects(); drawBase(); paint();
  });
  document.getElementById('run').addEventListener('click', function(){
    if(!defects.size) return;
    enterMission();
  });
}

function paint(errMsg){
  renderNav();
  var flow = document.getElementById('flow');

  if(view === 'catalogue'){ paintCatalogue(flow); return; }

  /* repair round finished */
  if(mission && trip.length > 1 && !busy && !options.length && !errMsg &&
     defectStations().every(function(l){ return visitedIdx().indexOf(l._i) !== -1; })){
    flow.innerHTML = missionHTML() +
      '<div class="done"><h2>Round complete ✓</h2>' +
      '<p>Every flagged bike handled' +
        (repaired.size ? ' (' + repaired.size + ' marked repaired)' : '') +
        ' — ' + (trip.length-1) + ' station' + (trip.length === 2 ? '' : 's') + ', about ' +
        mins(trip.reduce(function(a, s){ return a + (s.sec || 0); }, 0)) + ' of travel.</p>' +
      '<div class="startrow"><button class="chipbtn" id="copy" type="button">Copy the plan</button>' +
      '<button class="chipbtn" id="gmaps" type="button">Open in Google Maps</button></div></div>';
    var ex0 = document.getElementById('exitm');
    if(ex0) ex0.addEventListener('click', exitMission);
    var cp = document.getElementById('copy');
    if(cp) cp.addEventListener('click', copyPlan);
    var gm0 = document.getElementById('gmaps');
    if(gm0) gm0.addEventListener('click', openGmaps);
    return;
  }

  if(!trip.length){
    var last = null;
    try{ last = JSON.parse(localStorage.getItem('flotte-last-start') || 'null'); }catch(e){}
    flow.innerHTML = missionHTML() +
      '<div class="start">' +
        '<h2>' + (mission ? T('startRoundQ') : T('startQ')) + '</h2>' +
        '<p>' + (mission
          ? T('startRoundHint') : T('startHint')) + '</p>' +
        '<div class="searchwrap">' + IC.search +
          '<input class="addr" id="addr" type="search" placeholder="' + esc(T('addrPlaceholder')) + '" ' +
            'autocomplete="off" aria-label="' + esc(T('addrLabel')) + '"></div>' +
        '<div class="sugs" id="sugs"></div>' +
        '<div class="startrow">' +
          '<button class="chipbtn" id="geo" type="button">' + IC.gps + T('myLocation') + '</button>' +
          '<button class="chipbtn' + (picking ? ' on' : '') + '" id="pick" type="button">' +
            IC.pin + (picking ? T('pickArmed') : T('pickMap')) + '</button>' +
        '</div>' +
        (last && last.label ? '<button class="resume" id="resume" type="button">' +
          IC.refresh + T('resume', {label: esc(last.label)}) + '</button>' : '') +
        '<div class="note" id="note">' + (errMsg ? esc(errMsg) : '') + '</div>' +
      '</div>';
    wireStart(last);
    var exs = document.getElementById('exitm');
    if(exs) exs.addEventListener('click', exitMission);
    return;
  }

  var html = '<div class="trip"><div class="trip-top">' +
    '<span class="trip-title">' + T('yourTrip') + '</span><span class="trip-links">' +
    (trip.length > 1 ? '<button class="link" id="gmaps" type="button">' + T('maps') + '</button>' +
      '<button class="link" id="copy" type="button">' + T('copy') + '</button>' +
      '<button class="link" id="back" type="button">' + T('undo') + '</button>' : '') +
    '<button class="link" id="reset" type="button">' + T('restart') + '</button></span></div>' +
    '<div class="chain">';
  trip.forEach(function(s, n){
    if(n) html += IC.chev;
    var when = mins(s.sec);
    if(s.mode === 'transit' && s.dep){
      var lineLbl = '';
      (s.legs || []).some(function(L){
        if(!L.walking){ lineLbl = L.line ? esc(L.line) + ' ' : ''; return true; }
        return false;
      });
      when = lineLbl + clock(s.dep) + '–' + clock(s.arr);
    }
    html += '<span class="stop-chip"><span class="n' + (n ? '' : ' o') + '">' +
      (n || '') + '</span><span>' + esc(s.label) + '</span>' +
      (n ? '<small class="num">' + when + '</small>' : '') + '</span>';
  });
  html += '</div>';
  if(trip.length > 1){
    html += '<div class="trip-sum num">' + T('tripSum', {n: trip.length - 1,
      t: mins((depBaseMs() - Date.now()) / 1000), at: hhmm(depBaseMs())}) + '</div>';
  }
  html += '</div>';

  html += missionHTML();
  if(farKm != null && options.length){
    html += '<div class="mission">' + IC.pin + '<span>' +
      T('farStart', {dist: farKm > 0 ? T('aboutKm', {km: farKm}) : T('veryFar')}) + '</span>' +
      '<button class="link" id="farfix" type="button">' + T('restart') + '</button></div>';
  }
  // a failed reachable-from silently drops the stations only transit serves
  // well, which is the whole reason the scan exists — do not hide that
  if(roadEstimated && options.length){
    html += '<div class="mission">' + IC.route + '<span>' + T('roadEst') + '</span>' +
      '<button class="link" id="roadretry" type="button">' + T('tryAgain') + '</button></div>';
  }
  if(scanInfo && !scanInfo.ok && !mission){
    html += '<div class="mission">' + IC.tram + '<span>' + T('scanFailed') + '</span>' +
      '<button class="link" id="rescan" type="button">' + T('tryAgain') + '</button></div>';
  }
  html += '<div class="modes-row" role="tablist" aria-label="Travel mode">' +
    mtab('best', IC.zap, T('mBest')) + mtab('walk', IC.walk, T('mWalk')) +
    mtab('bike', IC.bike, T('mBike')) + mtab('transit', IC.tram, T('mTransit')) + '</div>';

  if(errMsg){
    html += '<div class="spin">' + esc(errMsg) +
      '<br><button class="retry" id="retry" type="button">' + T('tryAgain') + '</button></div>';
  }else if(!options.length){
    html += '<div class="spin">' + T('finding') +
      '<div class="progress" style="margin:10px 0 0"><i style="width:35%"></i></div></div>';
  }else{
    var list = sorted();
    ANIM = lastAnimToken !== token;           // rise only when this hop's list is new
    lastAnimToken = token;
    BOARD_ANIM = lastExpanded !== expanded;   // rise only when a card newly opens
    lastExpanded = expanded;
    // one-thumb summary: top option + Go, FIRST in the sheet so the peek
    // detent shows exactly this
    var top = list[0];
    if(top){
      var tl = LOCATIONS[top.i];
      var kick = busy ? T('checking')
        : (mission && top.i === tourNext() ? T('nextInRound') : T('fastest'));
      var pkMode = modePref === 'best' ? (bestMode(top) || 'walk') : modePref;
      var pkRec = pkMode === 'walk' ? top.walk : pkMode === 'bike' ? top.bike : null;
      var pkX = pkRec && pkRec.km != null ? ' · ' + km(pkRec.km) : '';
      if(pkMode === 'transit'){
        var pj = top.transit && top.transit.journeys && top.transit.journeys[top.selJ || 0];
        if(pj){
          var pls = pj.legs.filter(function(L){ return !L.walking; })
            .map(function(L){ return esc(L.line || '?'); }).slice(0, 3);
          pkX = (pls.length ? ' · ' + pls.join(' › ') : '') + ' · dep ' + clock(pj.dep);
        }
      }
      html = '<button class="peekbar" type="button" data-pk="' + top.i + '">' +
        '<span class="pk-body"><span class="pk-k">' + kick + '</span>' +
        '<b>' + esc(tl.location_name) + '</b>' +
        '<span class="pk-time num">' + mins(timeFor(top, modePref)) +
          ({walk:' walking', bike:' by bike', transit:' by transit'})[pkMode] + pkX +
        '</span></span>' +
        '<span class="pk-go">' + T('go') + IC.right + '</span></button>' + html;
    }
    var checked = options.filter(function(o){ return o.transit; }).length;
    html += '<div class="opts-head"><span>' +
      T('nearestFrom', {label: esc(here().label)}) +
      (baseFuture() ? T('leavingAt', {at: hhmm(depBaseMs())}) : '') +
      '</span>' +
      (busy ? '<span class="num">' + checked + '/' + options.length + '</span>' : '') + '</div>';
    if(busy) html += '<div class="progress"><i style="width:' +
      Math.round(checked/Math.max(options.length,1)*100) + '%"></i></div>';
    // numbers are the round order in a round, the time rank otherwise
    html += list.map(optHTML).join('');
    html += '<div class="kbd-hint">' + T('kbdHint', {n: Math.min(list.length, 9)}) + '</div>';
  }
  flow.innerHTML = html;
  wireList();
  wireThumbs(flow);
}

function wireStart(last){
  var addr = document.getElementById('addr');
  var sugs = document.getElementById('sugs');
  var note = document.getElementById('note');
  var timer = null, seq = 0;

  addr.addEventListener('focus', function(){ sheetTo('full'); });
  addr.addEventListener('input', function(){
    clearTimeout(timer);
    var q = addr.value.trim();
    if(q.length < 3){ sugs.innerHTML = ''; return; }
    timer = setTimeout(function(){
      var my = ++seq;
      vbbGet('/locations?query=' + encodeURIComponent(q) +
            '&results=5&addresses=true&poi=true&stops=true', VBB_TIMEOUT)
        .then(function(r){ return r.ok ? r.json() : []; })
        .then(function(list){
          if(my !== seq) return;
          sugs.innerHTML = list.map(function(x, n){
            var loc = x.location || x;
            if(loc.latitude == null) return '';
            var name = x.name || x.address || 'Unknown';
            return '<button class="sug" type="button" data-n="' + n + '">' +
              (x.type === 'stop' ? IC.tram : IC.pin) +
              '<span>' + esc(name) +
              (x.type === 'stop' ? '<small>stop</small>' : '') + '</span></button>';
          }).join('');
          Array.prototype.forEach.call(sugs.querySelectorAll('.sug'), function(el){
            el.addEventListener('click', function(){
              var x = list[+el.getAttribute('data-n')];
              var loc = x.location || x;
              start(loc.latitude, loc.longitude, x.name || x.address || 'Start');
            });
          });
        })
        .catch(function(){ if(my === seq) note.textContent = T('addrDown'); });
    }, 350);
  });

  document.getElementById('geo').addEventListener('click', function(){
    if(!navigator.geolocation){ note.textContent = T('geoNone'); return; }
    note.textContent = T('geoAsking');
    navigator.geolocation.getCurrentPosition(
      function(p){ start(p.coords.latitude, p.coords.longitude, T('myLocation')); },
      function(err){
        // file:// is not a secure context in Chromium, so this usually fails locally
        note.textContent = T('geoBlocked', {why: err.message});
      },
      {enableHighAccuracy:true, timeout:10000}
    );
  });
  document.getElementById('pick').addEventListener('click', function(){
    picking = !picking;
    map.getContainer().style.cursor = picking ? 'crosshair' : '';
    paint();
  });
  if(last && last.label){
    var res = document.getElementById('resume');
    if(res) res.addEventListener('click', function(){ start(last.lat, last.lon, last.label); });
  }
}

function wireList(){
  var flow = document.getElementById('flow');
  var el;
  if((el = document.getElementById('exitm'))) el.addEventListener('click', exitMission);
  if((el = document.getElementById('addstop'))) el.addEventListener('click', function(){
    addingStop = !addingStop;
    picking = false;
    map.getContainer().style.cursor = addingStop ? 'crosshair' : '';
    if(addingStop) sheetTo('peek');       // she needs to see the map to tap it
    paint();
  });
  if((el = document.getElementById('back')))  el.addEventListener('click', back);
  if((el = document.getElementById('reset'))) el.addEventListener('click', reset);
  if((el = document.getElementById('copy')))  el.addEventListener('click', copyPlan);
  if((el = document.getElementById('gmaps'))) el.addEventListener('click', openGmaps);
  if((el = document.getElementById('retry'))) el.addEventListener('click', nextHop);
  if((el = document.getElementById('rescan'))) el.addEventListener('click', nextHop);
  if((el = document.getElementById('roadretry'))) el.addEventListener('click', nextHop);
  if((el = document.getElementById('farfix'))) el.addEventListener('click', reset);
  Array.prototype.forEach.call(flow.querySelectorAll('[data-mode]'), function(t){
    t.addEventListener('click', function(){
      modePref = t.getAttribute('data-mode');
      // switching road mode invalidates the round: a bicycle order is not a
      // walking order, so re-solve rather than leave a stale sequence on screen
      if(mission && tour && trip.length && roundCosting() !== tour.costing){
        nextHop(); return;
      }
      // Best and Transit need departures a road mode never fetched
      if((modePref === 'best' || modePref === 'transit') && trip.length && !busy &&
         options.some(function(o){ return !o.transit; })){
        nextHop(); return;
      }
      paint(); drawTrip();
      if(expanded != null) previewOf(expanded);
      else if(options.length && !busy) previewOf(sorted()[0].i);
    });
  });
  Array.prototype.forEach.call(flow.querySelectorAll('.opt-main'), function(b){
    var i = +b.getAttribute('data-i');
    b.addEventListener('click', function(e){
      var d = e.target.closest && e.target.closest('[data-done]');
      if(d){ markRepaired(+d.getAttribute('data-done')); return; }
      expanded = (expanded === i) ? null : i;
      paint();
      previewOf(i);
    });
    b.addEventListener('mouseenter', function(){ previewOf(i); });
  });
  Array.prototype.forEach.call(flow.querySelectorAll('.dep'), function(b){
    b.addEventListener('click', function(){
      var o = optOf(+b.getAttribute('data-i'));
      if(o){ o.selJ = +b.getAttribute('data-j'); paint(); previewOf(o.i); }
    });
  });
  Array.prototype.forEach.call(flow.querySelectorAll('[data-go]'), function(b){
    b.addEventListener('click', function(){ choose(+b.getAttribute('data-go')); });
  });
  var pk = flow.querySelector('[data-pk]');
  if(pk) pk.addEventListener('click', function(e){
    var i = +pk.getAttribute('data-pk');
    if(e.target.closest('.pk-go')){ if(!busy) choose(i); return; }
    expanded = i; paint(); previewOf(i); sheetTo('half');
    var el2 = document.getElementById('opt-' + i);
    if(el2) el2.scrollIntoView({block:'nearest'});
  });
  Array.prototype.forEach.call(flow.querySelectorAll('[data-gleg]'), function(b){
    b.addEventListener('click', function(){
      var loc = LOCATIONS[+b.getAttribute('data-gleg')];
      window.open(gmapsLegUrl(here().lat, here().lon, loc.lat, loc.lon,
        b.getAttribute('data-gmode')), '_blank', 'noopener');
    });
  });
  Array.prototype.forEach.call(flow.querySelectorAll('[data-refresh]'), function(b){
    b.addEventListener('click', async function(){
      var o = optOf(+b.getAttribute('data-refresh'));
      if(!o) return;
      o.transit = null; paint();
      o.transit = await transitFor(LOCATIONS[o.i]);
      paint(); previewOf(o.i);
    });
  });
}

/* The list follows the map. Debounced because a pan fires continuously and
   repainting 267 rows per frame would stutter on a phone. */
var moveT = null;
map.on('moveend zoomend', function(){
  if(view !== 'catalogue' || !viewFilter) return;
  clearTimeout(moveT);
  moveT = setTimeout(function(){
    if(view !== 'catalogue') return;
    inView = map.getBounds();
    paint();
  }, 180);
});
map.on('click', function(e){
  if(addingStop){ addAdhocAt(e.latlng.lat, e.latlng.lng); return; }
  if(!picking) return;
  start(e.latlng.lat, e.latlng.lng, T('chosenPoint'));
});
// marker tooltips live outside #flow, so they need their own thumbnail wiring
map.on('tooltipopen', function(e){
  var el = e.tooltip && e.tooltip.getElement();
  if(el) wireThumbs(el);
});

document.addEventListener('keydown', function(e){
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if(view !== 'plan' || !trip.length || !options.length) return;
  var list = sorted();
  if(e.key >= '1' && e.key <= String(list.length)){
    var o = list[+e.key - 1];
    expanded = o.i; paint(); previewOf(o.i);
    var el2 = document.getElementById('opt-' + o.i);
    if(el2) el2.scrollIntoView({block:'nearest'});
  }else if(e.key === 'Enter' && expanded != null && !busy){
    choose(expanded);
  }else if(e.key === 'Escape' && expanded != null){
    expanded = null; paint(); lines.clearLayers();
  }
});

/* keep "leaves in N min" honest while the list sits open */
setInterval(function(){
  if(view === 'plan' && trip.length && options.length && !busy) paint();
}, 30000);

/* ---------- filters ---------- */
function buildFacets(){
  var el = document.getElementById('facets');
  el.innerHTML = '';
  LOC_FACETS.concat(ITEM_FACETS).forEach(function(f){
    var wrap = document.createElement('div'); wrap.className = 'facet';
    var h = document.createElement('div'); h.className = 'facet-name'; h.textContent = f.label;
    wrap.appendChild(h);
    var chips = document.createElement('div'); chips.className = 'chips';
    valuesFor(f.key).forEach(function(v){
      var n = countFor(f.key, v), on = filters[f.key].has(v);
      var b = document.createElement('button');
      b.className = 'chip'; b.type = 'button';
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
      if(n === 0 && !on) b.disabled = true;
      if(f.key === 'district'){
        var dot = document.createElement('span');
        dot.className = 'bk-dot';
        dot.style.background = colorOf(v);
        b.appendChild(dot);
      }
      var t = document.createElement('span'); t.textContent = v;
      var c = document.createElement('span'); c.className = 'chip-n'; c.textContent = n;
      b.appendChild(t); b.appendChild(c);
      b.addEventListener('click', function(){
        if(filters[f.key].has(v)) filters[f.key].delete(v); else filters[f.key].add(v);
        refilter();
      });
      chips.appendChild(b);
    });
    wrap.appendChild(chips);
    el.appendChild(wrap);
  });
}
function refilter(){
  buildFacets(); drawBase();
  tallyText();
  if(trip.length) nextHop(); else paint();
}
var qEl = document.getElementById('q'), qT;
qEl.addEventListener('input', function(){
  clearTimeout(qT);
  qT = setTimeout(function(){ filters.q = qEl.value.trim().toLowerCase(); refilter(); }, 160);
});

/* ---------- boot ---------- */
restoreAdhoc();                 // append before any _i is handed out
LOCATIONS.forEach(function(l, i){ l._i = i; });
document.documentElement.setAttribute('lang', LANG);
buildFacets(); drawBase(); applyStaticText(); paint();
document.getElementById('langbtn').addEventListener('click', function(){
  setLang(LANG === 'de' ? 'en' : 'de');
});
tallyText();
map.whenReady(function(){ setTimeout(function(){ map.invalidateSize(); }, 60); });
sheetInit();

/* test hook: lets smoke.mjs drive the app over CDP; not used by the UI */
window.__flotte = {
  start: start,
  choose: choose,
  startRound: function(ids){
    defects.clear();
    ids.forEach(function(id){ defects.add(id); });
    saveDefects();
    enterMission();
  },
  state: function(){
    return {
      busy: busy, mission: mission, farKm: farKm, scanInfo: scanInfo,
      modePref: modePref, baseMs: depBaseMs(),
      trip: trip.map(function(s){
        return {label: s.label, i: s.i, mode: s.mode, sec: s.sec, goMs: s.goMs || null,
                hasShape: !!(s.shape || s.legs)};
      }),
      options: sorted().map(function(o){
        return {i: o.i, viaScan: !!o.viaScan, hasTransit: !!o.transit,
                best: timeFor(o, 'best'), transit: timeFor(o, 'transit')};
      }),
      tour: tour ? {order: tour.order, totalSec: tour.totalSec, estimated: tour.estimated,
                    costing: tour.costing, offline: !!tour.offline,
                    dropped: tour.dropped || []} : null,
      matrix: MATRIX ? {n: MATRIX.n, decoded: Object.keys(matCache)} : null,
      roadEstimated: roadEstimated,
      lineCounts: {trip: tripLines.getLayers().length,
                   tour: tourLines.getLayers().length,
                   preview: lines.getLayers().length},
      sheet: {pos: sheetPos, mobile: mqMobile.matches,
              y: sheetEl.style.transform || null},
      dots: dots.getLayers().length,
      flags: {defects: defects.size, repaired: repaired.size}
    };
  },
  sheetTo: sheetTo
};
})();
</script>
